apiVersion: apps/v1
kind: Deployment

metadata:
  name: php-app-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: php-app

  template:
    metadata:
      labels:
        app: php-app

    spec:
      containers:
      - name: php-container
        image: php:8.2-cli

        ports:
        - containerPort: 80

        command: ["php", "-S", "0.0.0.0:80"]
